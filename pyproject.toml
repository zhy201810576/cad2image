[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2image"
version = "0.1.0"
description = "DWG/DXF → PNG/SVG 渲染管线，用 ODA File Converter + ezdxf 替换 Acme CAD Converter"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ezdxf>=1.1.3,<1.2",
    "PyMuPDF>=1.23,<1.25",
    "numpy>=1.22",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "Pillow>=9.0",      # 测试中读取 PNG 像素校验渲染结果
    "fonttools>=4.30",  # 仅用于从 .ttc 提取单文件 TTF（字体已生成，按需）
]

[project.scripts]
cad2image = "cad2image.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# 字体（SHX/TTF）与 py.typed 作为包数据随 wheel 分发，确保安装后中文渲染开箱即用。
[tool.setuptools.package-data]
cad2image = ["py.typed", "fonts/*.ttf", "fonts/*.shx"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
# E501 由 formatter 处理；B008 是 typer/fastapi 将 Option 作为默认值的框架惯用法。
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.8"
strict = true
# ezdxf 未声明 __all__，关闭隐式再导出检查以避免误报（运行时正确）。
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实 DWG 与 ODA File Converter 的集成测试",
]
